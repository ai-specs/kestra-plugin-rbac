name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rbac
      - name: Authenticate to the host image registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Extract published host compilation contract
        run: rbac/scripts/prepare-host.sh
      - name: Build, test, and verify thin jar
        working-directory: rbac
        run: ./gradlew clean check --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: kestra-rbac-authorizer
          path: |
            rbac/build/libs/kestra-rbac-authorizer.jar
            rbac/.integration/host-provenance.json
            rbac/build/reports/tests/test/
