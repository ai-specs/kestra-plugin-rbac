name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  packages: read

concurrency:
  group: plugin-rbac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      policy-postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: policy-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: rbac
      - name: Authenticate to the host image registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract published host compilation contract
        id: host_contract
        run: rbac/scripts/prepare-host.sh
      - name: Build, test, and verify thin jar
        working-directory: rbac
        run: |
          status=0
          ./gradlew clean check --console=plain || status=$?
          mkdir -p .evidence/unit
          cp -R build/reports/tests/test .evidence/unit/report
          cp -R build/test-results/test .evidence/unit/results
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          python3 scripts/check-application-project-tests.py .evidence/unit/results
      - name: Verify policy storage against PostgreSQL
        working-directory: rbac
        env:
          RBAC_STORE_TEST_JDBC: jdbc:postgresql://localhost:5432/postgres
        run: |
          status=0
          ./gradlew test --tests 'io.kestra.extensions.rbac.store.*' --tests 'io.kestra.extensions.rbac.declaration.ApplicationScopeDeclarationStoreTest' --tests 'io.kestra.extensions.rbac.applicationgroup.ApplicationGroupDirectoryServiceTest' --tests 'io.kestra.extensions.rbac.applicationgroup.ApplicationPermissionUpgradeTest' --tests 'io.kestra.extensions.rbac.applicationgroup.ApplicationPermissionControllerTest' --tests 'io.kestra.extensions.rbac.management.AccountGrantCleanupTest' --rerun-tasks --console=plain || status=$?
          mkdir -p .evidence/postgres
          cp -R build/reports/tests/test .evidence/postgres/report
          cp -R build/test-results/test .evidence/postgres/results
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          python3 scripts/check-policy-tests.py .evidence/postgres/results
          python3 scripts/check-declaration-upgrade-tests.py .evidence/postgres/results
      - name: Verify plugin account lifecycle against PostgreSQL
        working-directory: rbac
        env:
          RBAC_STORE_TEST_JDBC: jdbc:postgresql://localhost:5432/postgres
        run: |
          status=0
          ./gradlew lifecyclePostgresTest --console=plain || status=$?
          mkdir -p .evidence/lifecycle
          cp -R build/reports/tests/lifecyclePostgresTest .evidence/lifecycle/report
          cp -R build/test-results/lifecyclePostgresTest .evidence/lifecycle/results
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          python3 scripts/check-lifecycle-tests.py .evidence/lifecycle/results > .evidence/lifecycle/summary.json
      - name: Verify plugin UI in real Chromium
        if: always() && !cancelled() && steps.host_contract.outcome == 'success'
        working-directory: rbac/ui
        run: |
          node browser/initialize-report.mjs
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
          npm run test:browser
          node browser/check-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kestra-rbac-authorizer
          include-hidden-files: true
          path: |
            rbac/build/libs/kestra-rbac-authorizer.jar
            rbac/.integration/host-provenance.json
            rbac/build/reports/tests/test/
            rbac/build/test-results/test/
            rbac/.evidence/
