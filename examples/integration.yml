# Historical acceptance input; do not merge into current deployment configuration.
# Current CI converts test roles to schemaVersion 1 database policy before initialization.
# Users are created by OidcRbacFixtureTest, not by this policy file.
kestra:
  rbac:
    enabled: true
    typed:
      enabled: true
    instance-admin-roles: [deployment-admin]
    subjects: {}
    role-mapping:
      reader: [reader]
      writer: [writer]
      admin: [deployment-admin]
    roles:
      reader:
        - scope: NAMESPACE
          tenant: main
          namespace: rbac.allowed
          descendants: true
          resource: FLOW
          actions: [READ, LIST]
          all-ids: true
      writer:
        - scope: NAMESPACE
          tenant: main
          namespace: rbac.allowed
          descendants: true
          resource: FLOW
          actions: [READ, LIST, CREATE, UPDATE, EXECUTE]
          all-ids: true
        - scope: NAMESPACE
          tenant: main
          namespace: rbac.allowed
          descendants: true
          resource: EXECUTION
          actions: [CREATE, READ, ACCESS_OUTPUTS]
          all-ids: true
      deployment-admin: []
