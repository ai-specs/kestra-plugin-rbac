kestra:
  rbac:
    enabled: true
    # Explicitly map the bootstrap host role; default instance-admin-roles is empty.
    instance-admin-roles: [deployment-admin]
    roles:
      deployment-admin: []
      reader:
        - scope: NAMESPACE
          tenant: main
          namespace: prod.team
          descendants: true
          resource: FLOW
          actions: [READ, LIST]
          all-ids: true
      runner:
        - scope: NAMESPACE
          tenant: main
          namespace: prod.team
          descendants: false
          resource: FLOW
          actions: [READ, EXECUTE]
          ids: [approved-flow]
    subjects:
      alice: [reader]
    role-mapping:
      admin: [deployment-admin]
      oidc-approved-runner: [runner]
