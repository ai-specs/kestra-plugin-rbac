# 历史配置策略样例，仅用于理解旧策略和离线迁移；不得合并到当前部署配置。
# 当前部署只接受 policy-source: database，导入格式见 management-policy.json。
kestra:
  rbac:
    enabled: true
    typed:
      enabled: true
    # Explicitly map the bootstrap host role; default instance-admin-roles is empty.
    instance-admin-roles: [deployment-admin]
    roles:
      deployment-admin: []
      reader:
        - scope: NAMESPACE
          tenant: main
          namespace: prod.team
          descendants: true
          resource: FLOW
          actions: [READ, LIST]
          all-ids: true
      runner:
        - scope: NAMESPACE
          tenant: main
          namespace: prod.team
          descendants: false
          resource: FLOW
          actions: [READ, EXECUTE]
          ids: [approved-flow]
    subjects:
      alice: [reader]
    role-mapping:
      admin: [deployment-admin]
      oidc-approved-runner: [runner]
